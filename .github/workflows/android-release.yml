name: Android release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get Flutter packages
        working-directory: create-a-complete-flutter-android-alarm
        run: flutter pub get

      - name: Build release APK
        working-directory: create-a-complete-flutter-android-alarm
        run: flutter build apk --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: mistress-alarm-release-apk
          path: create-a-complete-flutter-android-alarm/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
